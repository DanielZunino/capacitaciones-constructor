<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de Prevención · Constructor Center</title><meta name="robots" content="noindex">
<style>
:root { --az:#0039A6; --rj:#DC281D; --am:#FFC20E; --vd:#2E7D32; --tx:#1F2328; --mu:#6B7280; --bg:#EEF2F7; --ln:#E2E8F0; }
* { box-sizing:border-box; } body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--tx); }
button, input, select, textarea { font:inherit; }
.top { background:#fff; border-bottom:4px solid var(--rj); padding:10px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; position:sticky; top:0; z-index:5; }
.top img { height:40px; } .top .tt { flex:1; min-width:160px; } .top .tt b { display:block; color:var(--az); letter-spacing:1px; font-size:13px; } .top .tt span { font-size:13px; color:var(--mu); }
.lnk { background:none; border:0; color:var(--az); text-decoration:underline; cursor:pointer; padding:4px; text-align:left; }
.wrap { max-width:1180px; margin:0 auto; padding:16px; }
.tabs { display:flex; gap:6px; margin-bottom:14px; overflow-x:auto; } .tab { border:0; background:#fff; border-radius:999px; padding:9px 16px; font-weight:bold; color:var(--mu); cursor:pointer; white-space:nowrap; border:2px solid transparent; }
.tab.on { background:var(--az); color:#fff; } .tab .ct { background:var(--rj); color:#fff; border-radius:999px; padding:0 7px; margin-left:6px; font-size:12px; }
.kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; margin-bottom:14px; }
.kpi { background:#fff; border-radius:14px; padding:12px 14px; border-left:6px solid var(--az); } .kpi small { display:block; font-size:11px; letter-spacing:1px; color:var(--mu); font-weight:bold; text-transform:uppercase; }
.kpi b { font-size:30px; display:block; margin-top:4px; } .kpi span { font-size:12px; color:var(--mu); }
.card { background:#fff; border-radius:14px; padding:14px; margin-bottom:14px; } .card h3 { margin:0 0 10px; font-size:15px; color:var(--az); letter-spacing:.5px; }
table { width:100%; border-collapse:collapse; font-size:14px; } th { text-align:left; font-size:11px; color:var(--mu); letter-spacing:1px; text-transform:uppercase; padding:6px; border-bottom:2px solid var(--ln); }
td { padding:8px 6px; border-bottom:1px solid var(--ln); vertical-align:middle; } .num { text-align:right; white-space:nowrap; }
.bar { height:8px; background:var(--ln); border-radius:99px; overflow:hidden; min-width:70px; } .bar i { display:block; height:100%; border-radius:99px; }
.pc { font-weight:bold; }
.filtros { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; align-items:center; }
.chip { border:2px solid var(--ln); background:#fff; border-radius:999px; padding:6px 12px; cursor:pointer; font-size:13px; } .chip.on { border-color:var(--az); background:#E3ECFA; color:var(--az); font-weight:bold; }
.buscar { flex:1; min-width:180px; border:2px solid var(--ln); border-radius:10px; padding:8px 10px; } select { border:2px solid var(--ln); border-radius:10px; padding:8px; background:#fff; }
.per { display:grid; grid-template-columns:1fr auto; gap:6px 12px; padding:10px 4px; border-bottom:1px solid var(--ln); }
.per .nm { font-weight:bold; } .per .sb { font-size:12px; color:var(--mu); } .per .bd { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; align-items:center; }
.bdg { font-size:12px; border-radius:6px; padding:2px 7px; font-weight:bold; white-space:nowrap; } .ok { background:#E8F5E9; color:var(--vd); } .bad { background:#FDECEC; color:#C62828; } .warn { background:#FFF4D6; color:#8A5A00; } .gr { background:#F1F3F5; color:var(--mu); }
.atr { grid-column:1/-1; font-size:12px; color:#C62828; display:none; } .per.open .atr { display:block; } .per .av { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--mu); }
.reps { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }
.rep { background:#fff; border-radius:14px; overflow:hidden; display:flex; flex-direction:column; border:2px solid var(--ln); } .rep.abierto { border-color:#FFB300; }
.rep .im { height:150px; background:#ECEFF1 center/cover no-repeat; display:flex; align-items:center; justify-content:center; font-size:40px; }
.rep .bx { padding:12px; display:flex; flex-direction:column; gap:6px; flex:1; } .rep .ds { font-size:14px; } .rep .mt { font-size:12px; color:var(--mu); }
.rep textarea { width:100%; border:2px solid var(--ln); border-radius:8px; padding:6px; font-size:13px; } .btn { border:0; border-radius:10px; padding:10px; font-weight:bold; cursor:pointer; background:var(--am); }
.btn.az { background:var(--az); color:#fff; }
.login { max-width:380px; margin:12vh auto; background:#fff; border-radius:18px; padding:24px; display:flex; flex-direction:column; gap:12px; text-align:center; border-top:8px solid var(--az); }
.login img { height:56px; margin:0 auto; } .login input { border:2px solid var(--ln); border-radius:10px; padding:12px; font-size:18px; text-align:center; letter-spacing:1px; }
.err { color:#C62828; font-size:13px; min-height:16px; } .vacio { color:var(--mu); padding:20px; text-align:center; }
.cargando { text-align:center; padding:40px; color:var(--mu); }
@media (max-width:600px) { .per { grid-template-columns:1fr; } .per .bd { justify-content:flex-start; } .kpi b { font-size:24px; } .ocm { display:none; } }
</style></head><body>

function login(msg) {
  $('#app').innerHTML = `<div class="login"><img src="${LOGO}" alt="Constructor Center"><h2 style="margin:0">Panel de Prevención</h2>
    <p style="margin:0;color:#6B7280">Para administración y gerentes de sucursal. Tu clave es tu primer nombre + los 4 últimos números de tu RUT (sin el dígito verificador).</p>
    <input id="cl" placeholder="Ej: juan1234" maxlength="30" autocomplete="off"><div class="err">${msg || ''}</div><button class="btn az" id="ent">Entrar</button></div>`;
  const go = () => { clave = $('#cl').value.trim().toLowerCase(); if (clave) cargar(); };
  $('#ent').onclick = go; $('#cl').onkeydown = e => { if (e.key === 'Enter') go(); };
}
async function cargar() {
  $('#app').innerHTML = '<div class="cargando">Cargando datos…</div>';
  try {
    const r = await fetch(URL_API + '?panel=' + encodeURIComponent(clave)).then(r => r.json());
    if (!r.ok) { try { localStorage.removeItem('panel_clave'); } catch (e) {} return login('Clave no válida o desactivada.'); }
    try { localStorage.setItem('panel_clave', clave); } catch (e) {}
    D = r; pintar();
  } catch (e) { login('No se pudo conectar. Revisa tu internet e intenta de nuevo.'); }
}
function resumenDe(ps, reps) {
  const s = k => ps.reduce((a, p) => a + (p[k] || 0), 0);
  return { n: ps.length, aFecha: pct(s('okV'), s('dV')), anual: pct(s('ok'), s('d')), ind: ps.filter(p => p.ind !== 'falta').length, ds: ps.filter(p => p.ds44).length,
    sinInd: ps.filter(p => p.ind === 'falta').length, atr: ps.filter(p => p.atr && p.atr.length).length, rep: reps.filter(r => r.estado !== 'Resuelto').length };
}
function pintar() {
  const u = D.user, P = D.personas, R = D.reportes, T = resumenDe(P, R);
  $('#app').innerHTML = `<div class="top"><img src="${LOGO}" alt="Constructor Center"><div class="tt"><b>PANEL DE PREVENCIÓN</b><span>${esc(u.nombre)} · ${u.rol === 'admin' ? 'Administrador · todas las sucursales' : 'Gerente · ' + esc(u.suc || 'todas')}</span></div>
    <span style="font-size:12px;color:#6B7280">Datos al ${esc(D.act || '—')}</span><button class="lnk" id="ref">↻ Actualizar</button><button class="lnk" id="sal">Salir</button></div>
    <div class="wrap"><div class="tabs">${[['resumen', 'Resumen'], ['personas', 'Trabajadores']].concat(D.reportes.length ? [['reportes', 'Reportes', T.rep]] : []).map(([k, t, c]) => `<button class="tab${vista === k ? ' on' : ''}" data-v="${k}">${t}${c ? `<span class="ct">${c}</span>` : ''}</button>`).join('')}</div><div id="cont"></div></div>`;
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { vista = b.dataset.v; pintar(); });
  $('#ref').onclick = cargar; $('#sal').onclick = () => { try { localStorage.removeItem('panel_clave'); } catch (e) {} clave = ''; login(); };
  ({ resumen: vResumen, personas: vPersonas, reportes: vReportes })[vista](T);
}
function vResumen(T) {
  const P = D.personas, R = D.reportes, sucs = [...new Set(P.map(p => p.s || '(sin sucursal)'))].sort();
  const k = (t, v, s, c) => `<div class="kpi" style="border-color:${c}"><small>${t}</small><b style="color:${c}">${v}</b><span>${s}</span></div>`;
  let h = `<div class="kpis">${k('Trabajadores', T.n, 'activos en la nómina', '#0039A6')}${k('Cumplimiento a la fecha', fp(T.aFecha), 'charlas que ya debían estar hechas', col(T.aFecha))}
    ${k('Avance del programa', fp(T.anual), 'todas las charlas obligatorias', col(T.anual))}${k('Inducción vigente', T.ind + ' / ' + T.n, T.sinInd + ' sin inducción', col(pct(T.ind, T.n)))}
    ${k('Curso DS 44', T.ds + ' / ' + T.n, 'con certificado vigente', col(pct(T.ds, T.n)))}${D.reportes.length ? k('Reportes abiertos', T.rep, 'condiciones o acciones inseguras', T.rep ? '#C62828' : '#2E7D32') : ''}</div>`;
  h += `<div class="card"><h3>📍 POR SUCURSAL</h3><table><tr><th>Sucursal</th><th class="num">Personas</th><th class="num ocm">Sin inducción</th><th>A la fecha</th><th class="ocm">Avance</th><th class="num">Reportes</th></tr>${sucs.map(s => {
    const ps = P.filter(p => (p.s || '(sin sucursal)') === s), t = resumenDe(ps, R.filter(r => (r.s || '(sin sucursal)') === s));
    return `<tr><td><button class="lnk" data-suc="${esc(s)}">${esc(s)}</button></td><td class="num">${t.n}</td><td class="num ocm">${t.sinInd ? `<span class="bdg bad">${t.sinInd}</span>` : '<span class="bdg ok">0</span>'}</td>
      <td><span class="pc" style="color:${col(t.aFecha)}">${fp(t.aFecha)}</span>${bar(t.aFecha)}</td><td class="ocm"><span class="pc" style="color:${col(t.anual)}">${fp(t.anual)}</span>${bar(t.anual)}</td><td class="num">${t.rep ? `<span class="bdg warn">${t.rep}</span>` : '0'}</td></tr>`; }).join('')}</table></div>`;
  const top = P.filter(p => p.ind === 'falta' || (p.atr && p.atr.length)).sort((a, b) => (b.atr.length + (b.ind === 'falta' ? 5 : 0)) - (a.atr.length + (a.ind === 'falta' ? 5 : 0))).slice(0, 10);
  h += `<div class="card"><h3>⚠️ REQUIEREN ATENCIÓN</h3>${top.length ? top.map(fila).join('') : '<div class="vacio">Todo al día 🎉</div>'}</div>`;
  $('#cont').innerHTML = h;
  document.querySelectorAll('[data-suc]').forEach(b => b.onclick = () => { fSuc = b.dataset.suc; vista = 'personas'; pintar(); });
  enlazarFilas();
}
function fila(p) {
  const av = pct(p.ok, p.d), ind = p.ind === 'ok' ? '<span class="bdg ok">Inducción ✔</span>' : p.ind === 'renovar' ? `<span class="bdg warn">Inducción vence ${esc(p.iv)}</span>` : '<span class="bdg bad">Sin inducción</span>';
  return `<div class="per" data-p><div><div class="nm">${esc(p.n)}</div><div class="sb">${esc(p.c)} · ${esc(p.s)}${p.e ? ' · ' + esc(p.e) : ''}</div>
    <div class="av">${p.ok} de ${p.d} charlas ${bar(av)}</div></div><div class="bd">${ind}<span class="bdg ${p.ds44 ? 'ok' : 'gr'}">DS 44 ${p.ds44 ? '✔' : '—'}</span>
    ${p.atr && p.atr.length ? `<span class="bdg bad">${p.atr.length} atrasada${p.atr.length > 1 ? 's' : ''} ▾</span>` : '<span class="bdg ok">Al día</span>'}<span class="bdg gr">${p.pts} pts</span></div>
    ${p.atr && p.atr.length ? `<div class="atr">Atrasadas: ${p.atr.map(esc).join(' · ')}</div>` : ''}</div>`;
}
const enlazarFilas = () => document.querySelectorAll('[data-p]').forEach(e => e.onclick = () => e.classList.toggle('open'));
function vPersonas() {
  const sucs = [...new Set(D.personas.map(p => p.s || '(sin sucursal)'))].sort();
  const F = { todos: () => true, sinind: p => p.ind === 'falta', atr: p => p.atr && p.atr.length, ds: p => !p.ds44, renovar: p => p.ind === 'renovar' };
  const lista = D.personas.filter(F[fPer]).filter(p => !fSuc || (p.s || '(sin sucursal)') === fSuc)
    .filter(p => !q || (p.n + ' ' + p.r + ' ' + p.c).toLowerCase().includes(q.toLowerCase())).sort((a, b) => String(a.n).localeCompare(b.n));
  $('#cont').innerHTML = `<div class="card"><div class="filtros">${[['todos', 'Todos'], ['sinind', 'Sin inducción'], ['atr', 'Atrasados'], ['ds', 'DS 44 pendiente'], ['renovar', 'Inducción por vencer']].map(([k, t]) => `<button class="chip${fPer === k ? ' on' : ''}" data-f="${k}">${t}</button>`).join('')}</div>
    <div class="filtros"><input class="buscar" id="q" placeholder="Buscar por nombre, RUT o cargo" value="${esc(q)}">${sucs.length > 1 ? `<select id="suc"><option value="">Todas las sucursales</option>${sucs.map(s => `<option${s === fSuc ? ' selected' : ''}>${esc(s)}</option>`).join('')}</select>` : ''}</div>
    <div style="font-size:12px;color:#6B7280;margin-bottom:6px">${lista.length} trabajador${lista.length === 1 ? '' : 'es'} · toca uno para ver sus charlas atrasadas</div>${lista.map(fila).join('') || '<div class="vacio">Nadie en este filtro.</div>'}</div>`;
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { fPer = b.dataset.f; vPersonas(); });
  $('#q').oninput = e => { q = e.target.value; clearTimeout(window.__t); window.__t = setTimeout(() => { vPersonas(); const i = $('#q'); i.focus(); i.setSelectionRange(q.length, q.length); }, 250); };
  if ($('#suc')) $('#suc').onchange = e => { fSuc = e.target.value; vPersonas(); };
  enlazarFilas();
}
function vReportes() {
  const L = D.reportes.filter(r => fRep === 'todos' || (fRep === 'Abierto' ? r.estado !== 'Resuelto' : r.estado === 'Resuelto'));
  $('#cont').innerHTML = `<div class="filtros">${[['Abierto', 'Abiertos'], ['Resuelto', 'Resueltos'], ['todos', 'Todos']].map(([k, t]) => `<button class="chip${fRep === k ? ' on' : ''}" data-r="${k}">${t}</button>`).join('')}</div>
    <div class="reps">${L.map(r => `<div class="rep ${r.estado !== 'Resuelto' ? 'abierto' : ''}"><div class="im" style="${r.mini ? `background-image:url(data:image/jpeg;base64,${r.mini})` : ''}">${r.mini ? '' : '📝'}</div>
      <div class="bx"><div><span class="bdg ${r.tipo === 'Casi accidente' ? 'bad' : 'warn'}">${esc(r.tipo)}</span> <span class="bdg ${r.estado === 'Resuelto' ? 'ok' : 'gr'}">${esc(r.estado)}</span></div>
      <div class="ds">${esc(r.desc)}</div><div class="mt">📍 ${esc(r.s || '—')}${r.lugar ? ' · ' + esc(r.lugar) : ''}<br>👤 ${esc(r.n)}${r.c ? ' · ' + esc(r.c) : ''}<br>🕒 ${esc(r.f)}</div>
      ${r.foto ? `<a href="${esc(r.foto)}" target="_blank" rel="noopener" style="font-size:13px">Ver foto completa</a>` : ''}
      ${r.estado === 'Resuelto' ? `<div class="mt">✔ Resuelto por ${esc(r.por)} el ${esc(r.fc)}${r.com ? ': ' + esc(r.com) : ''}</div>`
        : `<textarea rows="2" placeholder="¿Qué se hizo? (opcional)" data-c="${esc(r.id)}"></textarea><button class="btn" data-ok="${esc(r.id)}">Marcar resuelto</button>`}</div></div>`).join('') || '<div class="vacio">No hay reportes en este filtro.</div>'}</div>`;
  document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { fRep = b.dataset.r; vReportes(); });
  document.querySelectorAll('[data-ok]').forEach(b => b.onclick = () => {
    const id = b.dataset.ok, com = (document.querySelector(`[data-c="${id}"]`) || {}).value || '';
    fetch(URL_API, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ accion: 'reporte_estado', clave, id, estado: 'Resuelto', com }) }).catch(() => {});
    const r = D.reportes.find(x => x.id === id); Object.assign(r, { estado: 'Resuelto', por: D.user.nombre, fc: new Date().toLocaleDateString('es-CL'), com }); pintar(); });
}
if (clave) cargar(); else login();
</script></body></html>
